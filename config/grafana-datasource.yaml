apiVersion: 1

deleteDatasources:
  - name: Loki
  - name: Prometheus
  - name: Jaeger
  - name: Tempo
  - name: Redis

datasources:
  - name: Loki
    type: loki
    url: ${LOKI_HOST:-http://loki:3100}
  - name: Prometheus
    type: prometheus
    url: ${PROMETHEUS_HOST:-http://prometheus:9090}
  - name: Tempo
    type: tempo
    url: ${TEMPO_HOST:-http://tempo:3200}
  - name: Redis
    type: redis-datasource
    url: ${REDIS_HOST:-redis://redis:6379}
    jsonData:
      tlsAuth: true
